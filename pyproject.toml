[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["typer", "rich"]

[project.scripts]
ghost = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ghost*"]
